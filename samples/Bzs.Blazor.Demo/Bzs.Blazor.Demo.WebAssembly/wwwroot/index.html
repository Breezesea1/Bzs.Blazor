<!DOCTYPE html>
<html lang="zh-Hans">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Bzs.Blazor catalog</title>
    <link rel="icon" type="image/svg+xml" href="_content/Bzs.Blazor.Demo.Catalog/demo-logo.svg" />
    <link rel="stylesheet" href="_content/Bzs.Blazor.Demo.Catalog/demo-catalog.css" />
    <link rel="stylesheet" href="_content/Bzs.Blazor/bzs.blazor.css" />
    <link rel="stylesheet" href="demo-custom-theme.css" />
    <link rel="stylesheet" href="Bzs.Blazor.Demo.WebAssembly.styles.css" />
</head>

<body>
    <div id="app">
        <p class="demo-loading">Loading Bzs.Blazor catalog...</p>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        const parameters = new URLSearchParams(window.location.search);
        const selectedCulture = parameters.get("culture");
        const culture = selectedCulture?.toLowerCase() === "en-us" ? "en-US" : "zh-Hans";
        const route = parameters.get("route");
        if (route) {
            const baseUrl = new URL(document.baseURI);
            const targetUrl = new URL(route, baseUrl);
            if (targetUrl.origin === window.location.origin && targetUrl.pathname.startsWith(baseUrl.pathname)) {
                window.history.replaceState(null, "", `${targetUrl.pathname}${targetUrl.search}${targetUrl.hash}`);
            }
        }
        document.documentElement.lang = culture;
        Blazor.start({
            applicationCulture: culture
        });
    </script>
    <script type="module" src="_content/Bzs.Blazor.Demo.Catalog/demo-shell.js"></script>
</body>

</html>
