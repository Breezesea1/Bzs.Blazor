<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Bzs.Blazor catalog</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="_content/Bzs.Blazor.Demo.Catalog/demo-catalog.css" />
    <link rel="stylesheet" href="_content/Bzs.Blazor/bzs.blazor.css" />
    <link rel="stylesheet" href="demo-custom-theme.css" />
    <link rel="stylesheet" href="Bzs.Blazor.Demo.WebAssembly.styles.css" />
</head>

<body>
    <div id="app">
        <p class="demo-loading">Loading Bzs.Blazor catalog...</p>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        const selectedCulture = new URLSearchParams(window.location.search).get("culture");
        Blazor.start({
            applicationCulture: selectedCulture?.toLowerCase() === "zh-hans" ? "zh-Hans" : "en-US"
        });
    </script>
</body>

</html>
