<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Bzs.Blazor logo</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: url(#tile-dark); filter: url(#raise-dark); }
      .mark { fill: #a3a4ec; filter: url(#glyph-dark); }
    }
  </style>
  <defs>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafbfc" />
      <stop offset="1" stop-color="#dde2e9" />
    </linearGradient>
    <linearGradient id="tile-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d37" />
      <stop offset="1" stop-color="#141920" />
    </linearGradient>
    <filter id="raise-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="2" flood-color="#8c94a1" flood-opacity="0.45" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.7" />
    </filter>
    <filter id="raise-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="2" flood-color="#020407" flood-opacity="0.6" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="2" flood-color="#38424f" flood-opacity="0.4" />
    </filter>
    <filter id="glyph-light" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.1" flood-color="#8c94a1" flood-opacity="0.5" />
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.65" />
    </filter>
    <filter id="glyph-dark" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.1" flood-color="#020407" flood-opacity="0.55" />
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#38424f" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect class="tile" x="8" y="8" width="48" height="48" rx="12" fill="url(#tile-light)" filter="url(#raise-light)" />
  <g class="mark" fill="#5352ce" filter="url(#glyph-light)">
    <path d="M20.9 15H27.4V49H20.9Z" />
    <path fill-rule="evenodd" d="M24.9 15H32.1A7.6 7.6 0 0 1 32.1 30.2H24.9Z M27.4 19.9H31.8A3 2.7 0 0 1 31.8 25.3H27.4Z" />
    <path fill-rule="evenodd" d="M24.9 30.2H33.7A9.4 9.4 0 0 1 33.7 49H24.9Z M27.4 35.1H33.7A4.5 4.5 0 0 1 33.7 44.1H27.4Z" />
  </g>
</svg>
