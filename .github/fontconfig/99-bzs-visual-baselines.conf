<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic generic-family selection for the Linux visual-baseline jobs
  (ADR-0029). The library and demo CSS name real fonts first and fall back to
  the generic families, so fontconfig decides what those generics render as.

  The distribution defaults already resolve sans-serif, system-ui, ui-sans-serif,
  and the CJK fallback deterministically to the Noto families the workflow
  installs, and re-declaring them here measurably changes glyph selection (the
  Noto CJK fallback is spliced in at a different position), so this file
  deliberately leaves them alone.

  "monospace" is the one generic whose distribution top preference is a family
  the pinned font set does not install: fontconfig's 60-latin.conf ranks
  "DejaVu Sans Mono" above "Noto Mono". With only fonts-liberation,
  fonts-noto-core, and fonts-noto-cjk installed it falls through to Noto Mono,
  but any later package that drags in fonts-dejavu-core (fontconfig-config
  depends on "fonts-dejavu-core | fonts-liberation"), or any hand-tweak to the
  install step, silently flips monospace glyphs to DejaVu Sans Mono and makes
  monospace-bearing captures non-reproducible. This alias pins monospace to the
  installed Noto/Liberation mono families so the choice cannot drift.

  Verified against the committed baselines: all eleven pass with this alias on
  (Noto Mono) and off (DejaVu Sans Mono), so the pin changes no committed
  capture and only closes the drift.

  Keep the families below in step with the "Install pinned fonts" step in
  ci.yml, publish-nuget.yml, and refresh-visual-baselines.yml.
-->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Mono</family>
      <family>Noto Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>
</fontconfig>
