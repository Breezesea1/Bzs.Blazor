name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install WASM workload
        shell: pwsh
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Build Playwright runner
        shell: pwsh
        run: dotnet build tests/Bzs.Blazor.BrowserTests/Bzs.Blazor.BrowserTests.csproj --configuration Release

      - name: Install Playwright browsers
        shell: pwsh
        run: pwsh tests/Bzs.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit

      - name: Run complete release gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-release.ps1 -Configuration Release -SkipVisualRegression

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/release/**
            TestResults/**
            tests/**/TestResults/**

  windows-branded-browsers:
    name: Windows branded browsers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Build Playwright runner
        shell: pwsh
        run: dotnet build tests/Bzs.Blazor.BrowserTests/Bzs.Blazor.BrowserTests.csproj --configuration Release

      - name: Install Playwright browser
        shell: pwsh
        run: pwsh tests/Bzs.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run Windows visual regression baselines
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-visual-regression.ps1 -Configuration Release

      - name: Run Chrome and Edge browser matrix
        shell: pwsh
        run: ./tests/Bzs.Blazor.BrowserTests/run-browser-matrix.ps1 -Configuration Release -Targets chrome,msedge -RequireAllTargets -ArtifactsDirectory TestResults/browser-matrix

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-branded-browsers-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: TestResults/**
