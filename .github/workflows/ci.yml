name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302

      - name: Install WASM workload
        shell: pwsh
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Build Playwright runner
        shell: pwsh
        run: dotnet build tests/Bzs.Blazor.BrowserTests/Bzs.Blazor.BrowserTests.csproj --configuration Release

      - name: Install Playwright browsers
        shell: pwsh
        run: pwsh tests/Bzs.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit

      - name: Run complete release gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-release.ps1 -Configuration Release

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/release/**
            TestResults/**
            tests/**/TestResults/**

  windows-branded-browsers:
    name: Windows branded browsers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302

      - name: Build Playwright runner
        shell: pwsh
        run: dotnet build tests/Bzs.Blazor.BrowserTests/Bzs.Blazor.BrowserTests.csproj --configuration Release

      - name: Install Playwright browser
        shell: pwsh
        run: pwsh tests/Bzs.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run Chrome and Edge browser matrix
        shell: pwsh
        run: ./tests/Bzs.Blazor.BrowserTests/run-browser-matrix.ps1 -Configuration Release -Targets chrome,msedge -RequireAllTargets -ArtifactsDirectory TestResults/browser-matrix

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-branded-browsers-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: TestResults/browser-matrix/**
